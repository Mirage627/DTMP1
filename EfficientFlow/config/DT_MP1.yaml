defaults:
  - task: mimicgen_dt_pc_abs
  - _self_

name: train_dt_mp1
_target_: EfficientFlow.workspace.train_dt_mp1_workspace.TrainDTMP1Workspace

task_name: stack_d1
n_demo: 200
shape_meta: ${task.policy_shape_meta}
exp_name: "debug"

horizon: 4
n_obs_steps: 2
n_action_steps: 3  # predict 4; execute indices 1,2,3 after two observations
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
keypoint_visible_rate: 1.0
obs_as_global_cond: True

dataset_target: EfficientFlow.dataset.robomimic_replay_point_cloud_dataset.RobomimicReplayPointCloudDataset
dataset_path: data/robomimic/datasets/${task_name}/${task_name}_voxel_abs.hdf5



task:
  dataset:
    val_ratio: 0.16  # held-out demonstrations for fit/tune/accept/report

dt:
  family: diagonal  # baseline, global_scalar, sub_scalar, diagonal, full
  warmup_epochs: 5
  warmup_checkpoint: null  # optional warmup.ckpt from the same training setup
  fit_batches: 8
  tune_pairs: 8
  accept_pairs: 16
  report_pairs: 8
  budget_seconds: 60.0
  # Calibration/report time is amortized over actual remaining training batches.
  alpha: 0.05  # bootstrap significance level, NOT the tangent correction strength
  save_stage_checkpoints: true  # diagnostic model snapshots, not resumable checkpoints
  preflight_only: false  # load data + reset/infer/step, then exit before training
  seed: 314159

policy:
  _target_: EfficientFlow.policy.dt_mp1.DTMP1Policy
  use_point_crop: true
  condition_type: film
  use_down_condition: true
  use_mid_condition: true
  use_up_condition: true
  
  diffusion_step_embed_dim: 128
  down_dims:
  - 512
  - 1024
  - 2048
  crop_shape:
  - 84
  - 84
  encoder_output_dim: 64
  horizon: ${horizon}
  kernel_size: 5
  n_action_steps: ${n_action_steps}
  n_groups: 8
  n_obs_steps: ${n_obs_steps}
  obs_as_global_cond: true
  shape_meta: ${shape_meta}

  use_pc_color: true
  pointnet_type: "mlp"


  pointcloud_encoder_cfg:
    in_channels: 6
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm # layernorm, none
    normal_channel: false


ema:
  _target_: EfficientFlow.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: True
  pin_memory: True
  drop_last: True  # MP1 dispersive loss needs a non-singleton batch
  persistent_workers: False

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: ${eval:'int(50000 / ${n_demo})'}
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: ${eval:'max(5,int(1000 / ${n_demo}))'}
  checkpoint_every: ${eval:'max(1,int(1000 / ${n_demo}))'}
  enable_rollouts: true
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  max_grad_norm: 1.0
  ema_decay: 0.95

# Conditional_ConsistencyFM:
#   eps : 1e-2
#   num_segments : 2
#   boundary : 1
#   delta  : 1e-2
#   alpha :  1e-5
#   num_inference_step : 1

logging:
  group: ${exp_name}
  id: null
  mode: online
  name: ${exp_name}_${training.seed}
  project: DT_MP1
  resume: true
  tags: [DT_MP1]

checkpoint:
  save_ckpt: True
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 1
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True # this only saves when save_ckpt is True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
